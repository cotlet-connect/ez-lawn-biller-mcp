[project]
name = "ez-lawn-biller-mcp"
version = "1.1.0"
description = "Connect EZ Lawn Biller to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No EZ Lawn Biller API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["ez lawn biller", "ez lawn biller api", "ez lawn biller mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/ez-lawn-biller-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=ez-lawn-biller"
Source = "https://github.com/cotlet-connect/ez-lawn-biller-mcp"

[project.scripts]
ez-lawn-biller-mcp = "ez_lawn_biller_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ez_lawn_biller_agent.py" = "ez_lawn_biller_agent.py"

[tool.hatch.build.targets.sdist]
include = ["ez_lawn_biller_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
